name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check terminx tests scripts packaging
      - run: uv run ruff format --check terminx tests scripts packaging
      - run: uv run python scripts/check_docs.py
      - run: uv run python -m pip_audit --format json --output dependency-audit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: dependency-audit
          path: dependency-audit.json
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Windows'
        run: uv sync --locked --extra desktop --extra dev
      - if: runner.os != 'Windows'
        run: uv sync --locked --extra dev
      - if: runner.os == 'Windows'
        run: uv run python -c "from PySide6.QtCore import qVersion; print(qVersion())"
      - run: uv run python -m coverage run -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - if: runner.os == 'Windows'
        run: uv run python -m coverage report --fail-under=60
      - if: runner.os != 'Windows'
        run: uv run python -m coverage report
      - run: uv run python -m coverage xml
      - run: uv run python -m terminx --once
      - run: uv run python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: checks-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            dist/*.whl
            dist/*.tar.gz

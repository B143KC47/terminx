name: Release build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra desktop --extra dev --extra package
      - run: uv run ruff check terminx tests scripts packaging
      - run: uv run python scripts/check_docs.py
      - run: uv run python -c "from PySide6.QtCore import qVersion; print(qVersion())"
      - run: uv run python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Install the pinned compiler
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $toolsDirectory = Join-Path $env:RUNNER_TEMP 'terminx-tools'
          New-Item -ItemType Directory -Path $toolsDirectory -Force | Out-Null
          gh release download is-7_1_0 --repo jrsoftware/issrc --pattern innosetup-7.1.0-x64.exe --dir $toolsDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Compiler download failed' }
          $setupFile = Join-Path $toolsDirectory 'innosetup-7.1.0-x64.exe'
          if ((Get-AuthenticodeSignature -LiteralPath $setupFile).Status -ne 'Valid') { throw 'Compiler signature is invalid' }
          $compilerDirectory = Join-Path $toolsDirectory 'inno'
          $process = Start-Process -FilePath $setupFile -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',('/DIR="' + $compilerDirectory + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed' }
          "ISCC_PATH=$compilerDirectory\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build release files
        run: uv run python scripts/package_windows.py --iscc "$env:ISCC_PATH"
      - name: Check installation and removal
        run: uv run python scripts/check_windows_package.py --assets dist/release
      - name: Prepare final checksums
        run: uv run python -c "from pathlib import Path; from scripts.package_windows import checksum; checksum(Path('dist/release'))"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release
          path: dist/release/*
          retention-days: 30
